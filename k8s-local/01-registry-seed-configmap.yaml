apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-registry-seed
  namespace: mcp-registry
  labels:
    app.kubernetes.io/name: mcp-registry
    app.kubernetes.io/component: registry
data:
  seed.json: |
    [
      {
        "$schema": "https://static.modelcontextprotocol.io/schemas/2025-10-17/server.schema.json",
        "name": "io.github.github/github-mcp-server",
        "description": "Connect AI assistants to GitHub - manage repos, issues, PRs, and workflows through natural language.",
        "repository": {
          "url": "https://github.com/github/github-mcp-server",
          "source": "github"
        },
        "version": "0.19.1",
        "packages": [
          {
            "registryType": "oci",
            "identifier": "ghcr.io/github/github-mcp-server:0.19.1",
            "transport": {
              "type": "stdio"
            },
            "runtimeArguments": [
              {
                "description": "The runtime command to execute",
                "value": "run",
                "type": "positional"
              },
              {
                "description": "Run container in interactive mode",
                "type": "named",
                "name": "-i"
              },
              {
                "description": "Automatically remove the container when it exits",
                "type": "named",
                "name": "--rm"
              },
              {
                "description": "Set an environment variable in the runtime",
                "type": "named",
                "name": "-e"
              },
              {
                "description": "Environment variable name",
                "value": "GITHUB_PERSONAL_ACCESS_TOKEN",
                "type": "positional",
                "valueHint": "env_var_name"
              },
              {
                "description": "The container image to run",
                "value": "ghcr.io/github/github-mcp-server",
                "type": "positional",
                "valueHint": "image_name"
              }
            ],
            "environmentVariables": [
              {
                "description": "Your GitHub personal access token with appropriate scopes.",
                "isRequired": true,
                "format": "string",
                "isSecret": true,
                "name": "GITHUB_PERSONAL_ACCESS_TOKEN"
              }
            ]
          }
        ]
      },
      {
        "$schema": "https://static.modelcontextprotocol.io/schemas/2025-10-17/server.schema.json",
        "name": "io.github.github/github-mcp-server-remote",
        "description": "GitHub MCP server remoto (hosted por GitHub) - mismas capacidades sobre HTTP, sin Docker local.",
        "repository": {
          "url": "https://github.com/github/github-mcp-server",
          "source": "github"
        },
        "version": "0.19.1",
        "remotes": [
          {
            "type": "streamable-http",
            "url": "https://api.githubcopilot.com/mcp/"
          }
        ]
      },
      {
        "$schema": "https://static.modelcontextprotocol.io/schemas/2025-10-17/server.schema.json",
        "name": "io.github.microsoft/playwright-mcp",
        "description": "Playwright Tools for MCP",
        "repository": {
          "url": "https://github.com/microsoft/playwright-mcp",
          "source": "github"
        },
        "version": "0.0.75",
        "packages": [
          {
            "registryType": "npm",
            "identifier": "@playwright/mcp",
            "version": "0.0.75",
            "transport": {
              "type": "stdio"
            }
          }
        ]
      }
    ]
