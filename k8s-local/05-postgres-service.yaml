apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mcp-registry
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mcp-registry
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
